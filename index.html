<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<title>Kućni budžet</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--accent:#7c6af7;--accent2:#a78bfa;--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;--border:#2d2d4a;--text:#e2e8f0;--text2:#94a3b8;--red:#ef4444;--green:#22c55e;--yellow:#eab308;--radius:14px;--shadow:0 4px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none}
.app{max-width:480px;margin:0 auto;padding-bottom:2rem}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:.8rem 1rem .4rem;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
.header-actions{display:flex;align-items:center;gap:.5rem}
h1{font-size:1.1rem;font-weight:700;color:var(--accent2)}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:.6rem .2rem;border:none;background:none;color:var(--text2);font-size:13px;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.page{display:none;padding:1rem}
.page.active{display:block}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.month-nav button{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:.3rem .8rem;font-size:1.2rem;cursor:pointer}
.month-label{font-weight:600;font-size:1rem}
.salary-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem}
.salary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;text-align:center}
.salary-card .label{font-size:11px;color:var(--text2);margin-bottom:2px}
.salary-card .name{font-weight:700;font-size:.95rem;margin-bottom:.3rem}
.salary-card .badge{font-size:10px;color:var(--text2);margin-bottom:.5rem}
.salary-card input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.4rem .5rem;color:var(--text);font-size:1rem;text-align:center}
.salary-total{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:.5rem}
.salary-total .lbl{font-size:13px;color:var(--text2)}
.salary-total .val{font-weight:700;font-size:1.05rem;color:var(--green)}
.unalloc-card{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;margin-bottom:1rem}
.unalloc-lbl{font-size:13px;color:var(--text2)}
.unalloc-val{font-weight:700;font-size:1rem}
.section-title{font-size:.75rem;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin:.2rem 0 .5rem}
.category-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:.5rem;overflow:hidden}
.category-header{display:flex;align-items:center;padding:.75rem 1rem;cursor:pointer;gap:.6rem}
.category-header .icon{font-size:1.1rem}
.category-header .name{flex:1;font-size:.9rem;font-weight:600}
.category-header .summary{font-size:.8rem;color:var(--text2);text-align:right}
.category-header .summary .spent{display:block;font-weight:600;color:var(--text)}
.category-items{display:none;border-top:1px solid var(--border)}
.category-items.open{display:block}
.item-row{display:flex;align-items:center;padding:.55rem 1rem;gap:.6rem;border-bottom:1px solid var(--border)}
.item-row:last-child{border-bottom:none}
.item-row .item-name{flex:1;font-size:.85rem}
.item-row input[type=number]{width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.3rem .5rem;color:var(--text);font-size:.9rem;text-align:right}
.item-row .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .15s;flex-shrink:0}
.item-row .check.done{background:var(--green);border-color:var(--green)}
.progress-bar{height:4px;background:var(--surface2)}
.progress-fill{height:100%;background:var(--accent);transition:width .3s}
.progress-fill.warn{background:var(--yellow)}
.progress-fill.over{background:var(--red)}
/* Transakcije */
.add-trans-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem;display:flex;flex-direction:column;gap:.6rem}
.trans-row{display:flex;gap:.5rem}
.trans-row input,.trans-row select{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;color:var(--text);font-size:.9rem}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:.55rem 1.2rem;font-weight:700;font-size:.9rem;cursor:pointer}
.trans-list{display:flex;flex-direction:column;gap:.4rem}
.trans-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;display:flex;align-items:center;gap:.7rem}
.trans-item .ti-icon{font-size:1.1rem}
.trans-item .ti-info{flex:1}
.trans-item .ti-desc{font-size:.88rem;font-weight:600}
.trans-item .ti-meta{font-size:.75rem;color:var(--text2)}
.trans-item .ti-amount{font-weight:700;font-size:.95rem}
.trans-item .ti-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:1rem;padding:.2rem}
/* Pregled tab */
.overview-cards{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1rem}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem;text-align:center}
.ov-card .ov-lbl{font-size:11px;color:var(--text2);margin-bottom:.3rem}
.ov-card .ov-val{font-size:1.1rem;font-weight:700}
.cat-breakdown{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.cat-breakdown h3{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.7rem}
.cb-row{display:flex;align-items:center;gap:.6rem;margin-bottom:.5rem}
.cb-row .cb-name{flex:1;font-size:.85rem}
.cb-row .cb-bar-wrap{flex:2;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden}
.cb-row .cb-bar{height:100%;border-radius:4px;background:var(--accent)}
.cb-row .cb-val{font-size:.8rem;color:var(--text2);width:70px;text-align:right}
/* Trend tab */
.trend-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.trend-section h3{font-size:.8rem;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;margin-bottom:.8rem}
.trend-bars{display:flex;align-items:flex-end;gap:6px;height:90px}
.trend-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;height:100%}
.trend-bar{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.trend-bar.cur{background:var(--accent2)}
.trend-lbl{font-size:9px;color:var(--text2);margin-top:3px}
.trend-val{font-size:9px;color:var(--text);margin-bottom:2px}
.group-rows{margin-top:.5rem}
.gr-row{display:flex;align-items:center;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--border)}
.gr-row:last-child{border-bottom:none}
.gr-icon{font-size:1rem}
.gr-name{flex:1;font-size:.82rem}
.gr-bars{display:flex;gap:3px;align-items:flex-end;height:28px;width:70px}
.gr-bar{flex:1;border-radius:2px 2px 0 0;min-height:1px}
.gr-val{font-size:.78rem;color:var(--text2);width:50px;text-align:right}
/* Kalkulator */
.calc-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.calc-display{padding:1.5rem 1rem 1rem;text-align:right}
.calc-expr{font-size:.8rem;color:var(--text2);min-height:1.1rem}
.calc-result{font-size:2.2rem;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border)}
.calc-btn{background:var(--surface2);border:none;color:var(--text);font-size:1.2rem;font-weight:500;padding:1.1rem .5rem;cursor:pointer;transition:background .15s}
.calc-btn:active{background:var(--border)}
.calc-btn.op{color:var(--accent2)}
.calc-btn.eq{background:var(--accent);color:#fff}
.calc-btn.eq:active{background:var(--accent2)}
.calc-btn.span2{grid-column:span 2}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text2);transition:background .3s}
.sync-dot.syncing{background:var(--yellow);animation:pulse .8s infinite}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.acc-btn-icon{background:none;border:1px solid var(--border);border-radius:8px;padding:.3rem .55rem;cursor:pointer;font-size:1rem;color:var(--text2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:1.5rem 1rem 2rem;width:100%;max-width:480px}
.modal h2{font-size:1rem;font-weight:700;margin-bottom:1rem}
.modal-row{margin-bottom:.8rem}
.modal-row label{display:block;font-size:.8rem;color:var(--text2);margin-bottom:.3rem}
.modal-row input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.55rem .8rem;color:var(--text);font-size:.95rem}
.modal-actions{display:flex;gap:.6rem;margin-top:1.2rem}
.btn-cancel{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.65rem;color:var(--text2);font-weight:600;cursor:pointer}
.btn-confirm{flex:2;background:var(--accent);border:none;border-radius:8px;padding:.65rem;color:#fff;font-weight:700;cursor:pointer}
.btn-danger{flex:1;background:var(--red);border:none;border-radius:8px;padding:.65rem;color:#fff;font-weight:700;cursor:pointer}
/* Štednja */
.savings-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden}
.savings-head{display:flex;justify-content:space-between;align-items:center;padding:.85rem 1rem;cursor:pointer}
.savings-lbl{font-size:.9rem;font-weight:700}
.savings-val{font-size:1rem;font-weight:700;color:var(--green)}
.savings-body{display:none;border-top:1px solid var(--border);padding:0}
.savings-body.open{display:block}
.sav-item{display:flex;align-items:center;gap:.7rem;padding:.6rem 1rem;border-bottom:1px solid var(--border)}
.sav-item:last-child{border-bottom:none}
.sav-icon{font-size:1.1rem}
.sav-name{flex:1;font-size:.85rem;font-weight:600}
.sav-meta{font-size:.75rem;color:var(--text2);margin-top:1px}
.sav-amount{font-weight:700;font-size:.9rem;color:var(--green)}
.sav-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.9rem;padding:.2rem}
.btn-add-saving{width:100%;background:none;border:1px dashed var(--border);border-radius:8px;padding:.6rem;color:var(--text2);font-size:.85rem;cursor:pointer;margin-top:.3rem}
.bio-enroll-bar{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.8rem 1rem;margin-bottom:1rem;align-items:center;gap:.7rem}
.bio-enroll-bar .bio-txt{flex:1;font-size:.82rem;color:var(--text2)}
.bio-enroll-bar .bio-yes{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:.4rem .9rem;font-weight:700;cursor:pointer;font-size:.82rem}
.bio-enroll-bar .bio-no{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.82rem}
/* Lični troškovi */
.licni-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:1rem;overflow:hidden}
.licni-head{display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;cursor:pointer}
.licni-head-left{display:flex;align-items:center;gap:.6rem}
.licni-title{font-size:.9rem;font-weight:700}
.licni-summary{font-size:.8rem;color:var(--text2)}
.licni-body{display:none;border-top:1px solid var(--border)}
.licni-body.open{display:block}
.licni-person-block{padding:.6rem 1rem .3rem}
.licni-person-label{font-size:.75rem;font-weight:700;color:var(--accent2);margin-bottom:.4rem}
.licni-row{display:flex;align-items:center;gap:.6rem;padding:.3rem 0}
.licni-row .licni-name{flex:1;font-size:.85rem}
.licni-row input{width:90px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.3rem .5rem;color:var(--text);font-size:.9rem;text-align:right}
.licni-row .check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .15s;flex-shrink:0}
.licni-row .check.done{background:var(--green);border-color:var(--green)}
.licni-divider{height:1px;background:var(--border);margin:.2rem 0}
.licni-totals{display:flex;gap:1rem;padding:.5rem 1rem .6rem;font-size:.8rem;color:var(--text2)}
.licni-totals span b{color:var(--text)}
/* Transfer */
.transfer-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:1rem}
.transfer-form h3{font-size:.85rem;color:var(--text2);margin-bottom:.7rem;font-weight:600}
.trans-accounts{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.trans-accounts select{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.5rem .7rem;color:var(--text);font-size:.9rem}
.trans-accounts .arrow{color:var(--text2);font-size:1.2rem}
/* Računi inline dugme */
.racun-inline-btn{display:inline-flex;align-items:center;gap:3px;background:none;border:1px solid var(--border);border-radius:6px;padding:2px 6px;font-size:10px;color:var(--text2);cursor:pointer;margin-left:4px;vertical-align:middle}
.racun-inline-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
/* Računi modal */
.racun-list-modal{max-height:220px;overflow-y:auto;margin-bottom:.7rem}
.racun-modal-item{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--border)}
.racun-modal-item:last-child{border-bottom:none}
.racun-modal-item .rm-name{flex:1;font-size:.85rem}
.racun-modal-item .rm-amount{font-weight:700;font-size:.85rem}
.racun-modal-item .rm-check{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;transition:all .15s}
.racun-modal-item .rm-check.done{background:var(--green);border-color:var(--green)}
.racun-modal-item .rm-del{background:none;border:none;color:var(--text2);cursor:pointer;font-size:.9rem;padding:.2rem}
.racun-add-row{display:flex;gap:.5rem;margin-top:.5rem}
.racun-add-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:.45rem .6rem;color:var(--text);font-size:.88rem}
.racun-add-row button{background:var(--accent);border:none;border-radius:8px;padding:.45rem .9rem;color:#fff;font-weight:700;cursor:pointer;font-size:.88rem}
</style>
</head>
<body>
<div class="app">
<div class="header">
<div class="header-top">
<h1>🏠 Kućni budžet</h1>
<div class="header-actions">
<button class="acc-btn-icon" id="acc-btn" onclick="openAccountModal()" title="Nalog" style="display:none">👤</button>
<div class="sync-dot" id="sync-dot" title="Firebase sync"></div>
</div>
</div>
<div class="tabs">
<button class="tab active" onclick="switchTab('budzet')">Budžet</button>
<button class="tab" onclick="switchTab('transakcije')">Transakcije</button>
<button class="tab" onclick="switchTab('pregled')">Pregled</button>
<button class="tab" onclick="switchTab('trend')">Trend</button>
<button class="tab" onclick="switchTab('kalkulator')">Kalk.</button>
</div>
</div>
