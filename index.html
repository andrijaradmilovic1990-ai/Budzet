<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f1a">
<title>Kućni Budžet</title>
<link rel="manifest" href="manifest.json">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#242440;--accent:#6c63ff;
    --accent2:#ff6b9d;--text:#e8e8f0;--text2:#9898b8;--border:#2e2e50;
    --green:#4ade80;--red:#f87171;--amber:#fbbf24;
    --radius:12px;--radius-sm:8px;
  }
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:80px}
  .header{background:var(--surface);padding:1rem 1.25rem 0;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border)}
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
  .header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--text2)}
  .sync-dot.online{background:var(--green)}
  .sync-dot.offline{background:var(--red)}
  .tabs{display:flex;gap:4px}
  .tab{flex:1;padding:.6rem;border:none;background:none;color:var(--text2);font-size:14px;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;transition:all .2s}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent)}
  .page{display:none;padding:1rem}
  .page.active{display:block}
  .salary-grid{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:1.5rem}
  .salary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
  .salary-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);margin-bottom:.4rem}
  .salary-card .name{font-size:13px;font-weight:500;margin-bottom:.5rem}
  .salary-card .badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:rgba(108,99,255,.15);color:var(--accent);margin-bottom:.6rem}
  .salary-card input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.5rem .75rem;color:var(--text);font-size:15px;font-weight:600}
  .salary-card input:focus{outline:none;border-color:var(--accent)}
  .salary-total{background:linear-gradient(135deg,rgba(108,99,255,.1),rgba(255,107,157,.1));border:1px solid rgba(108,99,255,.3);border-radius:var(--radius);padding:1rem 1.25rem;display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem}
  .salary-total .lbl{font-size:13px;color:var(--text2)}
  .salary-total .val{font-size:20px;font-weight:700;color:var(--accent)}
  .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin:.75rem 0 .5rem;display:flex;align-items:center;gap:.5rem}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border)}
  .budget-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:.5rem}
  .item-row{display:flex;align-items:center;gap:.75rem}
  .item-name{flex:1;font-size:14px;font-weight:500}
  .item-planned{width:100px}
  .item-planned input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.4rem .6rem;color:var(--text);font-size:13px;text-align:right}
  .item-planned input:focus{outline:none;border-color:var(--accent)}
  .item-bar{margin-top:.6rem}
  .bar-track{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
  .bar-fill{height:100%;border-radius:2px;transition:width .3s}
  .bar-info{display:flex;justify-content:space-between;margin-top:.3rem}
  .bar-spent{font-size:11px;color:var(--text2)}
  .bar-left{font-size:11px;font-weight:600}
  .bar-left.ok{color:var(--green)}
  .bar-left.warn{color:var(--amber)}
  .bar-left.over{color:var(--red)}
  .reset-btn{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.3);border-radius:6px;color:#4ade80;font-size:11px;font-weight:600;padding:3px 8px;cursor:pointer;white-space:nowrap;margin-right:4px}
  .reset-btn:hover{background:rgba(74,222,128,.22)}
  .add-btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius);padding:.85rem;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:1.25rem}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal-overlay.open{opacity:1;pointer-events:all}
  .modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:1.5rem;width:100%;max-width:480px;transform:translateY(40px);transition:transform .2s}
  .modal-overlay.open .modal{transform:translateY(0)}
  .modal h3{font-size:16px;font-weight:600;margin-bottom:1.25rem}
  .form-group{margin-bottom:1rem}
  .form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.05em}
  .form-group input,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.65rem .85rem;color:var(--text);font-size:15px}
  .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent)}
  .form-group select option{background:var(--surface2)}
  .modal-btns{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-top:1.5rem}
  .btn-cancel{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem;color:var(--text2);font-size:14px;cursor:pointer}
  .btn-save{background:var(--accent);border:none;border-radius:var(--radius-sm);padding:.75rem;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .tx-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.85rem 1rem;margin-bottom:.5rem;display:flex;align-items:center;gap:.75rem}
  .tx-icon{width:38px;height:38px;border-radius:10px;background:rgba(108,99,255,.15);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
  .tx-info{flex:1}
  .tx-cat{font-size:13px;font-weight:500}
  .tx-desc{font-size:12px;color:var(--text2)}
  .tx-date{font-size:11px;color:var(--text2);margin-top:2px}
  .tx-amount{font-size:16px;font-weight:700;color:var(--red)}
  .tx-del{background:none;border:none;color:var(--text2);font-size:18px;cursor:pointer;padding:0 4px;line-height:1}
  .empty{text-align:center;color:var(--text2);font-size:13px;padding:2rem 0}
  .month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.6rem 1rem;margin-bottom:1.25rem}
  .month-nav button{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:0 .5rem;line-height:1}
  .month-nav .month-label{font-size:14px;font-weight:600}
  .loading{text-align:center;color:var(--text2);padding:3rem 0;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>💰 Kućni Budžet</h1>
    <div class="sync-dot" id="sync-dot" title="Firebase sync"></div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('budzet')">Budžet</button>
    <button class="tab" onclick="switchTab('transakcije')">Transakcije</button>
  </div>
</div>

<div id="page-budzet" class="page active">
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="month-label"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <div class="salary-grid">
    <div class="salary-card">
      <div class="label">Plata</div>
      <div class="name">Andrija</div>
      <div class="badge">💼 15. u mesecu</div>
      <input type="number" id="sal-andrija" placeholder="0" oninput="saveSalary('andrija',this.value)">
    </div>
    <div class="salary-card">
      <div class="label">Plata</div>
      <div class="name">Katarina</div>
      <div class="badge">💼 7. u mesecu</div>
      <input type="number" id="sal-katarina" placeholder="0" oninput="saveSalary('katarina',this.value)">
    </div>
  </div>
  <div class="salary-total">
    <span class="lbl">Ukupno u kasi</span>
    <span class="val" id="total-income">0 RSD</span>
  </div>
  <div id="budget-sections"><div class="loading">Učitavanje...</div></div>
</div>

<div id="page-transakcije" class="page">
  <div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <span class="month-label" id="month-label-2"></span>
    <button onclick="changeMonth(1)">›</button>
  </div>
  <button class="add-btn" onclick="openModal()">+ Nova transakcija</button>
  <div id="tx-list"></div>
</div>

<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <h3>Nova transakcija</h3>
    <div class="form-group">
      <label>Iznos (RSD)</label>
      <input type="number" id="tx-amount" placeholder="0">
    </div>
    <div class="form-group">
      <label>Kategorija</label>
      <select id="tx-cat"></select>
    </div>
    <div class="form-group">
      <label>Opis (opciono)</label>
      <input type="text" id="tx-desc" placeholder="npr. Lidl, benzin...">
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Otkaži</button>
      <button class="btn-save" onclick="saveTransaction()">Sačuvaj</button>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getDatabase,ref,set,onValue,remove} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey:"AIzaSyDI03DXl54GvRv99Ywb0-53rI1dhsYM18c",
  authDomain:"budzet-f3992.firebaseapp.com",
  projectId:"budzet-f3992",
  databaseURL:"https://budzet-f3992-default-rtdb.europe-west1.firebasedatabase.app",
  storageBucket:"budzet-f3992.firebasestorage.app",
  messagingSenderId:"633902520397",
  appId:"1:633902520397:web:1488ffe3d9626a8c586404"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const SECTIONS = [
  {id:'nedelja1',label:'Nedelja 1'},{id:'nedelja2',label:'Nedelja 2'},
  {id:'nedelja3',label:'Nedelja 3'},{id:'nedelja4',label:'Nedelja 4'},
  {id:'dodatne',label:'Dodatne stvari'},{id:'nepredvidjeni',label:'Nepredviđeni troškovi'},
  {id:'racuni',label:'Računi'},{id:'stednja',label:'Štednja'},
];
const ICONS = {nedelja1:'🛒',nedelja2:'🛒',nedelja3:'🛒',nedelja4:'🛒',dodatne:'🎯',nepredvidjeni:'⚡',racuni:'🧾',stednja:'🏦'};
const MONTHS_SR = ['Januar','Februar','Mart','April','Maj','Jun','Jul','Avgust','September','Oktobar','November','Decembar'];

let currentMonth = new Date().getMonth();
let currentYear = new Date().getFullYear();
let state = {salaries:{andrija:0,katarina:0},budget_items:{},transactions:{}};

function dbPath(suffix){return `budzet/${currentYear}/${currentMonth}/${suffix}`}

function setSyncDot(online){
  const d=document.getElementById('sync-dot');
  d.className='sync-dot '+(online?'online':'offline');
}

function listenMonth(){
  setSyncDot(false);
  const r=ref(db,`budzet/${currentYear}/${currentMonth}`);
  onValue(r,snap=>{
    setSyncDot(true);
    const d=snap.val()||{};
    state.salaries=d.salaries||{andrija:0,katarina:0};
    state.budget_items=d.budget_items||{};
    state.transactions=d.transactions||{};
    renderAll();
  },()=>setSyncDot(false));
}

function fmtRSD(n){return Math.round(n).toLocaleString('sr-RS')+' RSD'}

window.saveSalary=function(who,val){
  state.salaries[who]=parseFloat(val)||0;
  set(ref(db,dbPath('salaries')),state.salaries);
};

window.saveBudgetItem=function(el){
  state.budget_items[el.dataset.id]=parseFloat(el.value)||0;
  set(ref(db,dbPath('budget_items')),state.budget_items);
};

window.resetWeekToSavings=function(catId,left){
  if(!confirm(`Prebaciti ${fmtRSD(left)} u Štednju?`))return;
  const ts=Date.now();
  state.budget_items[catId]=(state.budget_items[catId]||0)-left;
  state.budget_items['stednja']=(state.budget_items['stednja']||0)+left;
  state.transactions[ts]={amount:-left,cat:'stednja',desc:`Prenos iz ${SECTIONS.find(s=>s.id===catId)?.label}`,ts,transfer:true};
  set(ref(db,dbPath('budget_items')),state.budget_items);
  set(ref(db,dbPath('transactions')),state.transactions);
};

window.changeMonth=function(d){
  currentMonth+=d;
  if(currentMonth>11){currentMonth=0;currentYear++}
  if(currentMonth<0){currentMonth=11;currentYear--}
  listenMonth();
};

window.switchTab=function(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',['budzet','transakcije'][i]===tab));
  document.getElementById('page-budzet').classList.toggle('active',tab==='budzet');
  document.getElementById('page-transakcije').classList.toggle('active',tab==='transakcije');
};

function getSpent(catId){
  return Object.values(state.transactions)
    .filter(t=>t.cat===catId&&!t.transfer)
    .reduce((s,t)=>s+Math.abs(t.amount),0);
}

function renderAll(){
  const lbl=`${MONTHS_SR[currentMonth]} ${currentYear}`;
  document.getElementById('month-label').textContent=lbl;
  document.getElementById('month-label-2').textContent=lbl;
  const a=state.salaries.andrija||0,k=state.salaries.katarina||0;
  document.getElementById('sal-andrija').value=a||'';
  document.getElementById('sal-katarina').value=k||'';
  document.getElementById('total-income').textContent=fmtRSD(a+k);
  renderBudgetSections();
  renderTransactions();
}

function renderBudgetSections(){
  const cont=document.getElementById('budget-sections');
  let html='';
  SECTIONS.forEach(s=>{
    const planned=state.budget_items[s.id]||0;
    const spent=getSpent(s.id);
    const left=planned-spent;
    const pct=planned>0?Math.min(100,(spent/planned)*100):0;
    const cls=left<0?'over':pct>75?'warn':'ok';
    const barColor=left<0?'#f87171':pct>75?'#fbbf24':'#4ade80';
    const isWeek=s.id.startsWith('nedelja');
    const canReset=isWeek&&left>0&&planned>0;
    html+=`<div class="budget-item">
      <div class="item-row">
        <span style="font-size:20px">${ICONS[s.id]||'📦'}</span>
        <span class="item-name">${s.label}</span>
        ${canReset?`<button class="reset-btn" onclick="resetWeekToSavings('${s.id}',${left})">↓ Štednja</button>`:''}
        <div class="item-planned">
          <input type="number" placeholder="0" value="${planned||''}" data-id="${s.id}" oninput="saveBudgetItem(this)">
        </div>
      </div>
      ${planned>0?`<div class="item-bar">
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barColor}"></div></div>
        <div class="bar-info">
          <span class="bar-spent">Potrošeno: ${fmtRSD(spent)}</span>
          <span class="bar-left ${cls}">${left>=0?'Ostalo: ':'Prekoračeno: '}${fmtRSD(Math.abs(left))}</span>
        </div>
      </div>`:''}
    </div>`;
  });
  cont.innerHTML=html;
}

function renderTransactions(){
  const txs=Object.values(state.transactions);
  const list=document.getElementById('tx-list');
  if(!txs.length){list.innerHTML='<div class="empty">Nema transakcija ovog meseca</div>';return}
  const sorted=[...txs].sort((a,b)=>b.ts-a.ts);
  list.innerHTML=sorted.map(t=>`
    <div class="tx-item">
      <div class="tx-icon">${ICONS[t.cat]||'💳'}</div>
      <div class="tx-info">
        <div class="tx-cat">${SECTIONS.find(s=>s.id===t.cat)?.label||t.cat}</div>
        ${t.desc?`<div class="tx-desc">${t.desc}</div>`:''}
        <div class="tx-date">${new Date(t.ts).toLocaleDateString('sr-RS')}</div>
      </div>
      <span class="tx-amount">-${fmtRSD(Math.abs(t.amount))}</span>
      <button class="tx-del" onclick="deleteTx(${t.ts})">×</button>
    </div>
  `).join('');
}

window.deleteTx=function(ts){
  remove(ref(db,dbPath(`transactions/${ts}`)));
};

window.openModal=function(){
  const sel=document.getElementById('tx-cat');
  sel.innerHTML=SECTIONS.map(s=>`<option value="${s.id}">${s.label}</option>`).join('');
  document.getElementById('tx-amount').value='';
  document.getElementById('tx-desc').value='';
  document.getElementById('modal').classList.add('open');
};
window.closeModal=function(){document.getElementById('modal').classList.remove('open')};
window.closeModalOutside=function(e){if(e.target===document.getElementById('modal'))closeModal()};

window.saveTransaction=function(){
  const amount=parseFloat(document.getElementById('tx-amount').value)||0;
  if(!amount){alert('Unesi iznos');return}
  const cat=document.getElementById('tx-cat').value;
  const desc=document.getElementById('tx-desc').value.trim();
  const ts=Date.now();
  set(ref(db,dbPath(`transactions/${ts}`)),{amount,cat,desc,ts});
  closeModal();
};

listenMonth();
</script>
</body>
</html>
