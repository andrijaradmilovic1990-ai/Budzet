<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f0f1a">
<title>Škola</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#0f0f1a;--surface:#1a1a2e;--surface2:#242440;--accent:#6c63ff;
--accent2:#ff6b9d;--text:#e8e8f0;--text2:#9898b8;--border:#2e2e50;
--green:#4ade80;--red:#f87171;--yellow:#fbbf24;--radius:12px;--radius-sm:8px;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;max-width:560px;margin:0 auto;padding:1.1rem;padding-top:max(1.1rem,env(safe-area-inset-top));padding-bottom:max(1.5rem,env(safe-area-inset-bottom))}
h1{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.1rem;gap:.5rem}
.sync{font-size:11px;color:var(--text2)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;margin-bottom:.8rem}
.card.istaknuto{border-color:var(--accent)}
.btn{display:block;width:100%;border:none;border-radius:var(--radius);padding:.9rem;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.4}
.lbl{font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.35rem}
.nas{font-size:18px;font-weight:600;margin-bottom:.25rem}
.sub{font-size:13px;color:var(--text2);margin-bottom:.9rem;line-height:1.4}
.obl{display:flex;align-items:center;gap:.8rem;cursor:pointer}
.obl .ik{font-size:26px;width:34px;text-align:center}
.obl .ime{font-weight:600}
.obl .era{font-size:11px;color:var(--text2)}
.tacke{display:flex;gap:4px;margin-top:5px}
.tacke i{width:9px;height:9px;border-radius:50%;background:var(--surface2);border:1px solid var(--border)}
.tacke i.da{background:var(--green);border-color:var(--green)}
.tacke i.pise{opacity:.35}
.linija{border-left:2px dashed var(--border);margin:-.55rem 0 -.55rem 1.95rem;height:.9rem}
.les{display:flex;align-items:center;gap:.7rem;padding:.75rem 0;border-bottom:1px solid var(--border);cursor:pointer}
.les:last-child{border-bottom:none}
.les .st{width:26px;text-align:center}
.les .n{flex:1}
.les .dat{font-size:12px;color:var(--text2)}
.les.pise{opacity:.45;cursor:default}
.nazad{background:none;border:none;color:var(--text2);font-size:14px;cursor:pointer;padding:.3rem 0}
.traka{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:.4rem 0 1rem}
.traka div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dn{font-size:20px;font-weight:700;margin-bottom:.8rem}
.tekst{font-size:17px;line-height:1.6;white-space:pre-wrap}
.dugmad{display:flex;gap:.6rem;margin-top:1.2rem}
.dugmad .btn{flex:1}
.link{background:none;border:none;color:var(--text2);font-size:13px;text-decoration:underline;cursor:pointer;margin-top:.9rem;padding:.3rem 0}
.opc{display:block;width:100%;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.85rem;color:var(--text);font-size:16px;margin-bottom:.55rem;cursor:pointer;line-height:1.35}
.opc.izabrano{border-color:var(--accent)}
.opc.tacno{border-color:var(--green);background:rgba(74,222,128,.12)}
.opc.netacno{border-color:var(--red);background:rgba(248,113,113,.12)}
.opc:disabled{cursor:default}
.zasto{font-size:15px;line-height:1.5;padding:.8rem;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--border);margin-top:.4rem}
.pitanje{font-size:18px;line-height:1.45;font-weight:600;margin-bottom:1rem}
textarea{width:100%;min-height:110px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.75rem;color:var(--text);font-size:16px;font-family:inherit;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
.kljuc{display:flex;gap:.7rem;align-items:flex-start;padding:.7rem;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:.5rem;cursor:pointer;font-size:15px;line-height:1.45}
.kljuc .cb{width:22px;height:22px;border-radius:6px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.kljuc.da{border-color:var(--green)}
.kljuc.da .cb{background:var(--green);border-color:var(--green);color:#0f0f1a}
.odg{font-size:15px;line-height:1.5;white-space:pre-wrap;background:var(--surface2);border-radius:var(--radius-sm);padding:.7rem;margin-bottom:.9rem}
.kartica{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center;font-size:19px;line-height:1.45}
.kartica .o{margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);color:var(--green);font-size:17px}
.helena{border-color:var(--accent2)}
.helena .tekst{font-size:15px}
.poruka{font-size:13px;color:var(--green);min-height:18px;margin-top:.5rem;text-align:center}
.poruka.err{color:var(--red)}
.gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:1.5rem;z-index:10}
.gate .box{text-align:center;max-width:320px;width:100%}
.gate .logo{font-size:52px;margin-bottom:.5rem}
.gate p{font-size:13px;color:var(--text2);margin:.4rem 0 1.4rem}
.skriven{display:none!important}
.metod p{font-size:15px;line-height:1.55;margin-bottom:.7rem}
</style>
</head>
<body>
<div id="gate" class="gate">
<div class="box">
<div class="logo">🦉</div>
<h1>Škola</h1>
<p id="gate-sub">Učitavanje…</p>
<button class="btn skriven" id="btn-google">Prijavi se Google nalogom</button>
<div class="poruka err" id="gate-err"></div>
</div>
</div>
<div id="app"></div>

<script type="module">
import {OBLASTI, RED, RAZMACI} from './lekcije.js';

const PROBA = new URLSearchParams(location.search).has('proba');
const $app = document.getElementById('app');
const SVE = [];
OBLASTI.forEach(o=>o.lekcije.forEach((l,i)=>SVE.push({...l, oblast:o, redni:i+1})));
const nadji = id => SVE.find(l=>l.id===id);
const napisana = l => !!(l&&l.delovi);

// ---------- čuvanje: Firebase (skola/...) ili lokalno u probi ----------
let baza;
async function napraviBazu(){
if(PROBA){
const k='skola-proba';
const ucitaj=()=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}};
const sacuvaj=d=>{try{localStorage.setItem(k,JSON.stringify(d))}catch(e){}};
let slusalac=null;
return {
async citaj(){return ucitaj()},
async pisi(put,v){const d=ucitaj();const p=put.split('/');let o=d;p.slice(0,-1).forEach(x=>{o[x]=o[x]||{};o=o[x]});o[p[p.length-1]]=v;sacuvaj(d);if(slusalac)slusalac(d)},
slusaj(cb){slusalac=cb;cb(ucitaj())}
};
}
const {initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
const {getDatabase,ref,set,get,onValue}=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js');
const A=await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
const app=initializeApp({
apiKey:"AIzaSyDI03DXl54GvRv99Ywb0-53rI1dhsYM18c",
authDomain:"budzet-f3992.firebaseapp.com",
projectId:"budzet-f3992",
databaseURL:"https://budzet-f3992-default-rtdb.europe-west1.firebasedatabase.app",
storageBucket:"budzet-f3992.firebasestorage.app",
messagingSenderId:"633902520397",
appId:"1:633902520397:web:1488ffe3d9626a8c586404"
});
const db=getDatabase(app);
const auth=A.getAuth(app);
const provider=new A.GoogleAuthProvider();
document.getElementById('btn-google').onclick=async()=>{
greska('');
try{await A.signInWithPopup(auth,provider)}
catch(e){
const c=(e&&e.code)||'';
if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){
try{await A.signInWithRedirect(auth,provider)}catch(e2){greska(e2.message||e2)}
}else if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request'){greska(e.message||e)}
}
};
A.setPersistence(auth,A.browserLocalPersistence).catch(()=>{});
A.getRedirectResult(auth).catch(e=>greska(e.message||e));
await new Promise(res=>{
A.onAuthStateChanged(auth,u=>{
if(u){res()}
else{document.getElementById('gate-sub').textContent='Prijavi se istim nalogom kao u Budžetu.';document.getElementById('btn-google').classList.remove('skriven')}
});
});
onValue(ref(db,'.info/connected'),s=>{const e=document.getElementById('sync');if(e)e.textContent=s.val()?'● povezano':'○ nije povezano'});
return {
async citaj(){return (await get(ref(db,'skola'))).val()||{}},
async pisi(put,v){await set(ref(db,'skola/'+put),v)},
slusaj(cb){onValue(ref(db,'skola'),s=>cb(s.val()||{}))}
};
}
function greska(m){document.getElementById('gate-err').textContent=m?String(m):''}

// ---------- vreme ----------
const p2=n=>String(n).padStart(2,'0');
function danas(pomak=0){const d=new Date();d.setDate(d.getDate()+pomak);return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function sad(){const d=new Date();return `${danas()} ${p2(d.getHours())}:${p2(d.getMinutes())}`}

// ---------- stanje ----------
let S={};            // ceo skola/ čvor
let ekran={tip:'pocetna'};
let crtano=false;
const L = id => (S.lekcije&&S.lekcije[id])||{};
const zavrsena = id => !!L(id).zavrseno;
const komentar = id => S.komentari&&S.komentari[id];
function redosled(n,kljuc){let h=2166136261;for(const c of kljuc){h^=c.charCodeAt(0);h=Math.imul(h,16777619)>>>0}
const rnd=()=>{h=(h+0x6D2B79F5)>>>0;let t=h;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296};
const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// Koraci jedne lekcije: kuka → (deo, provera)×n → sećanje → ključno → razgovor → kraj
function koraci(l){
const k=[{t:'kuka'}];
l.delovi.forEach((d,i)=>{k.push({t:'deo',i});k.push({t:'pr',i})});
k.push({t:'secanje'},{t:'kljucno'},{t:'razgovor'},{t:'kraj'});
return k;
}
function sledeca(){
const st=S.stanje;
if(st&&napisana(nadji(st.lekcija))&&!zavrsena(st.lekcija))return {l:nadji(st.lekcija),korak:st.korak||0};
const id=RED.find(x=>!zavrsena(x));
return id?{l:nadji(id),korak:0}:null;
}
function zaPonavljanje(){
const d=danas(),k=S.kartice||{};
return Object.keys(k).filter(id=>k[id]&&k[id].sledece<=d).sort((a,b)=>k[a].sledece<k[b].sledece?-1:1);
}
function kartica(id){const [lid,i]=id.split('_');const l=nadji(lid);return l&&l.kartice?{l,...l.kartice[+i]}:null}

// ---------- ekrani ----------
function crtaj(){
crtano=true;
const t=ekran.tip;
if(t==='pocetna')return pocetna();
if(t==='oblast')return oblast(OBLASTI.find(o=>o.id===ekran.oblast));
if(t==='lekcija')return lekcija(nadji(ekran.id),ekran.korak);
if(t==='pregled')return pregled(nadji(ekran.id));
if(t==='ponavljanje')return ponavljanje();
if(t==='metod')return metod();
}

function pocetna(){
const n=sledeca(),pon=zaPonavljanje();
const gotovo=SVE.filter(l=>zavrsena(l.id)).length;
let h=`<div class="top"><h1>🦉 Škola</h1><span class="sync" id="sync">${PROBA?'proba (lokalno)':''}</span></div>`;
if(pon.length)h+=`<div class="card istaknuto"><div class="lbl">Prvo ponavljanje</div><div class="nas">${pon.length} ${pon.length===1?'kartica':'kartica'} čeka</div><div class="sub">Oko ${Math.max(1,Math.round(pon.length/2))} min. Ovo je deo koji čini da zapamtiš.</div><button class="btn" id="btn-pon">Ponovi</button></div>`;
if(n){
if(napisana(n.l)){
const pocela=n.korak>0;
h+=`<div class="card"><div class="lbl">${pocela?'Nastavi':'Sledeća lekcija'}</div><div class="nas">${esc(n.l.naslov)}</div>
<div class="sub">${n.l.oblast.ikona} ${esc(n.l.oblast.naziv)} · ${n.l.redni}/${n.l.oblast.lekcije.length} · oko 15 min</div>
<button class="btn${pon.length?' sec':''}" id="btn-nastavi">${pocela?'Nastavi':'Počni'}</button></div>`;
}else{
h+=`<div class="card"><div class="lbl">Sledeća lekcija</div><div class="nas">${esc(n.l.naslov)}</div><div class="sub">${n.l.oblast.ikona} ${esc(n.l.oblast.naziv)} — još se piše. Javi Heleni ili agentu da je napiše. Do tada: ponavljanje ili neka napisana lekcija sa mape.</div></div>`;
}
}else h+=`<div class="card"><div class="nas">Sve je pređeno 🎉</div><div class="sub">Ponavljanje i dalje dolazi samo.</div></div>`;
h+=`<div class="lbl" style="margin-top:1.2rem">Mapa · priča od početka · pređeno ${gotovo}/${SVE.length}</div>`;
OBLASTI.forEach((o,i)=>{
if(i)h+='<div class="linija"></div>';
const tacke=o.lekcije.map(l=>`<i class="${zavrsena(l.id)?'da':(napisana(l)?'':'pise')}"></i>`).join('');
h+=`<div class="card obl" data-o="${o.id}"><span class="ik">${o.ikona}</span><div><div class="ime">${esc(o.naziv)}</div><div class="era">${esc(o.era)}</div><div class="tacke">${tacke}</div></div></div>`;
});
h+=`<button class="link" id="btn-metod">Kako ova škola uči (i zašto)</button>`;
$app.innerHTML=h;
const b=document.getElementById('btn-nastavi');if(b)b.onclick=()=>idi({tip:'lekcija',id:n.l.id,korak:n.korak});
const bp=document.getElementById('btn-pon');if(bp)bp.onclick=()=>{ekran={tip:'ponavljanje',red:pon.slice(),prvi:{},okrenuto:false};crtaj()};
document.getElementById('btn-metod').onclick=()=>idi({tip:'metod'});
$app.querySelectorAll('.obl').forEach(e=>e.onclick=()=>idi({tip:'oblast',oblast:e.dataset.o}));
}

function oblast(o){
let h=`<button class="nazad" id="nazad">← Mapa</button><div class="top"><h1>${o.ikona} ${esc(o.naziv)}</h1></div><div class="card">`;
o.lekcije.forEach((l,i)=>{
const z=zavrsena(l.id),w=napisana(l);
h+=`<div class="les${w?'':' pise'}" data-id="${l.id}"><span class="st">${z?'✅':i+1}</span><div class="n">${esc(l.naslov)}
<div class="dat">${z?`završeno ${esc(L(l.id).zavrseno)}${komentar(l.id)?' · 💬 Helena':''}`:(w?'':'piše se')}</div></div></div>`;
});
$app.innerHTML=h+'</div>';
document.getElementById('nazad').onclick=()=>idi({tip:'pocetna'});
$app.querySelectorAll('.les').forEach(e=>{const l=nadji(e.dataset.id);if(!napisana(l))return;
e.onclick=()=>idi(zavrsena(l.id)?{tip:'pregled',id:l.id}:{tip:'lekcija',id:l.id,korak:(S.stanje&&S.stanje.lekcija===l.id&&S.stanje.korak)||0})});
}

function zaglavlje(l,k,uk){
return `<button class="nazad" id="nazad">← ${esc(l.oblast.naziv)}</button>
<div class="lbl" style="margin-top:.6rem">${esc(l.naslov)}</div>
<div class="traka"><div style="width:${Math.round((k+1)/uk*100)}%"></div></div>`;
}

function lekcija(l,k){
const K=koraci(l);k=Math.max(0,Math.min(k||0,K.length-1));
const s=K[k],z=L(l.id);
let h=zaglavlje(l,k,K.length);
if(s.t==='kuka'){
h+=`<div class="lbl">Pre nego što počneš — pogodi</div><div class="pitanje">${esc(l.kuka.p)}</div>`;
redosled(l.kuka.o.length,l.id+'k').forEach(i=>{const o=l.kuka.o[i];h+=`<button class="opc${z.pogodak===i?' izabrano':''}" data-i="${i}">${esc(o)}</button>`});
h+=`<p class="sub" style="margin-top:.6rem">Ne moraš da znaš. Pokušaj da pogodiš pomaže da zapamtiš — odgovor je u lekciji.</p>
<div class="dugmad"><button class="btn" id="dalje"${z.pogodak==null?' disabled':''}>Dalje</button></div>`;
}
else if(s.t==='deo'){
const d=l.delovi[s.i];
h+=`<div class="dn">${esc(d.n)}</div><div class="tekst">${esc(d.t)}</div>
<div class="dugmad"><button class="btn sec" id="pre">Nazad</button><button class="btn" id="dalje">Proveri se</button></div>
<button class="link" id="dublje">Hoću više o ovome kasnije</button><div class="poruka" id="por"></div>`;
}
else if(s.t==='pr'){
const d=l.delovi[s.i],pr=d.pr,odg=(z.provere||{})[s.i];
h+=`<div class="lbl">Brza provera · ${esc(d.n)}</div><div class="pitanje">${esc(pr.p)}</div>`;
const izabrano=ekran.izbor!=null?ekran.izbor:(odg?odg.izbor:null);
redosled(pr.o.length,l.id+'p'+s.i).forEach(i=>{const o=pr.o[i];
let c='';if(izabrano!=null){if(i===pr.t)c=' tacno';else if(i===izabrano)c=' netacno'}
h+=`<button class="opc${c}" data-i="${i}"${izabrano!=null?' disabled':''}>${esc(o)}</button>`;
});
if(izabrano!=null)h+=`<div class="zasto">${izabrano===pr.t?'✅ Tačno. ':'❌ Nije. '}${esc(pr.z)}</div>`;
h+=`<div class="dugmad"><button class="btn sec" id="pre">Nazad</button><button class="btn" id="dalje"${izabrano==null?' disabled':''}>Dalje</button></div>`;
}
else if(s.t==='secanje'){
h+=`<div class="lbl">Bez gledanja u tekst</div><div class="pitanje">Napiši sve čega se sećaš iz ove lekcije. Kratko, svojim rečima — tri do pet stvari.</div>
<textarea id="sec" placeholder="Šta ti je ostalo u glavi…">${esc(z.secanje||'')}</textarea>
<p class="sub" style="margin-top:.6rem">Ovo je najvažniji korak. Izvlačenje iz glave pamti se mnogo jače od ponovnog čitanja.</p>
<div class="dugmad"><button class="btn sec" id="pre">Nazad</button><button class="btn" id="dalje">Uporedi</button></div><div class="poruka" id="por"></div>`;
}
else if(s.t==='kljucno'){
const imao=z.imao||{};
h+=`<div class="lbl">Ključne ideje</div><div class="sub">Označi one koje si i sam napisao (ili skoro). Iskreno — ovo vidi samo Helena.</div>`;
l.kljucno.forEach((q,i)=>h+=`<div class="kljuc${imao[i]?' da':''}" data-i="${i}"><span class="cb">${imao[i]?'✓':''}</span><span>${esc(q)}</span></div>`);
h+=`<div class="dugmad"><button class="btn sec" id="pre">Nazad</button><button class="btn" id="dalje">Dalje</button></div>`;
}
else if(s.t==='razgovor'){
const o=z.odgovori||{};
h+=`<div class="lbl">Za razgovor sa Helenom</div><div class="sub">Ovo nema tačan odgovor. Napiši šta misliš — Helena će to pročitati i nastaviti razgovor.</div>`;
l.razgovor.forEach((p,i)=>h+=`<div style="margin-bottom:1rem"><p style="font-size:16px;line-height:1.45;margin-bottom:.45rem">${i+1}. ${esc(p)}</p><textarea data-i="${i}">${esc(o[i]||'')}</textarea></div>`);
h+=`<div class="dugmad"><button class="btn sec" id="pre">Nazad</button><button class="btn" id="dalje">Završi lekciju</button></div><div class="poruka" id="por"></div>`;
}
$app.innerHTML=h;window.scrollTo(0,0);
document.getElementById('nazad').onclick=()=>idi({tip:'oblast',oblast:l.oblast.id});
const pre=document.getElementById('pre');if(pre)pre.onclick=()=>korak(l,k-1);
const da=document.getElementById('dalje');

if(s.t==='kuka'){
$app.querySelectorAll('.opc').forEach(b=>b.onclick=async()=>{await baza.pisi(`lekcije/${l.id}/pogodak`,+b.dataset.i);ekran.korak=k;crtaj()});
da.onclick=()=>korak(l,k+1);
}
if(s.t==='deo'){
da.onclick=()=>korak(l,k+1);
document.getElementById('dublje').onclick=async()=>{await baza.pisi('dublje/'+Date.now(),{lekcija:l.id,deo:l.delovi[s.i].n,datum:sad()});poruka('Zapisano — Helena će videti.')};
}
if(s.t==='pr'){
$app.querySelectorAll('.opc').forEach(b=>b.onclick=async()=>{const i=+b.dataset.i;ekran.izbor=i;
await baza.pisi(`lekcije/${l.id}/provere/${s.i}`,{izbor:i,tacno:i===l.delovi[s.i].pr.t});crtaj()});
da.onclick=()=>korak(l,k+1);
}
if(s.t==='secanje'){
const t=document.getElementById('sec');
const cuvaj=()=>baza.pisi(`lekcije/${l.id}/secanje`,t.value.trim());
t.onblur=cuvaj;
da.onclick=async()=>{if(t.value.trim().length<10){poruka('Napiši bar nešto — i jedna rečenica vredi.',true);return}await cuvaj();korak(l,k+1)};
}
if(s.t==='kljucno'){
$app.querySelectorAll('.kljuc').forEach(e=>e.onclick=async()=>{const imao={...(L(l.id).imao||{})};imao[e.dataset.i]=!imao[e.dataset.i];await baza.pisi(`lekcije/${l.id}/imao`,imao);ekran.korak=k;crtaj()});
da.onclick=()=>korak(l,k+1);
}
if(s.t==='razgovor'){
const odg=()=>{const o={};$app.querySelectorAll('textarea').forEach(t=>o[t.dataset.i]=t.value.trim());return o};
$app.querySelectorAll('textarea').forEach(t=>t.onblur=()=>baza.pisi(`lekcije/${l.id}/odgovori`,odg()));
da.onclick=async()=>{
const o=odg();
if(Object.values(o).filter(Boolean).length<l.razgovor.length){poruka('Odgovori na oba pitanja — može i kratko.',true);return}
da.disabled=true;
await baza.pisi(`lekcije/${l.id}/odgovori`,o);
await baza.pisi(`lekcije/${l.id}/zavrseno`,sad());
// kartice ulaze u ponavljanje: prvo ponavljanje sutra
const sut=danas(1);
for(let i=0;i<l.kartice.length;i++){const id=`${l.id}_${i}`;if(!(S.kartice&&S.kartice[id]))await baza.pisi(`kartice/${id}`,{kutija:0,sledece:sut})}
const sl=RED[RED.indexOf(l.id)+1];
await baza.pisi('stanje',{lekcija:sl||l.id,korak:0,azurirano:sad()});
idi({tip:'pregled',id:l.id,novo:true});
};
}
}
async function korak(l,k){
await baza.pisi('stanje',{lekcija:l.id,korak:k,azurirano:sad()});
idi({tip:'lekcija',id:l.id,korak:k});
}

function helenaTekst(l){return `Škola: završio sam lekciju „${l.naslov}" (${l.id}). Pogledaj šta sam napisao i hajde da pričamo.`}
async function kaHeleni(l){
const t=helenaTekst(l);
try{await navigator.clipboard.writeText(t)}catch(e){}
await baza.pisi('helena/poziv',{lekcija:l.id,datum:sad()});
window.open('https://claude.ai/new?q='+encodeURIComponent(t),'_blank');
}

function pregled(l){
const z=L(l.id),k=komentar(l.id),pr=z.provere||{};
const tacnih=Object.values(pr).filter(x=>x&&x.tacno).length;
const imao=Object.values(z.imao||{}).filter(Boolean).length;
let h=`<button class="nazad" id="nazad">← ${esc(l.oblast.naziv)}</button><div class="top" style="margin-top:.6rem"><h1>${esc(l.naslov)}</h1></div>`;
if(ekran.novo)h+=`<div class="card istaknuto"><div class="nas">Lekcija pređena ✓</div><div class="sub">Sad razgovor sa Helenom — tu se proverava da li si stvarno razumeo. ${l.kartice.length} kartica ide u ponavljanje, prvo sutra.</div><button class="btn" id="btn-helena">💬 Razgovaraj sa Helenom</button><div class="sub" style="margin:.5rem 0 0">Tekst se kopira — ako se Claude ne otvori sam, nalepi ga Heleni.</div></div>`;
if(k)h+=`<div class="card helena"><div class="lbl">💬 Helena · ${esc(k.datum||'')}</div><div class="tekst">${esc(k.tekst||k)}</div></div>`;
h+=`<div class="card"><div class="lbl">Kako je prošlo</div>
<p class="sub" style="margin-bottom:.4rem">Pogodak na početku: ${z.pogodak===l.kuka.t?'✅ tačno':'❌ „'+esc(l.kuka.o[z.pogodak]||'—')+'"'} — tačno je „${esc(l.kuka.o[l.kuka.t])}".</p>
<p class="sub" style="margin-bottom:.4rem">Brze provere: ${tacnih}/${l.delovi.length} iz prve.</p>
<p class="sub" style="margin-bottom:0">Ključne ideje koje si sam napisao: ${imao}/${l.kljucno.length}.</p></div>`;
h+=`<div class="card"><div class="lbl">Tvoje sećanje</div><div class="odg">${esc(z.secanje||'—')}</div>`;
l.razgovor.forEach((p,i)=>{h+=`<p class="sub" style="margin-bottom:.3rem">${i+1}. ${esc(p)}</p><div class="odg">${esc((z.odgovori||{})[i]||'—')}</div>`});
h+=`</div><div class="dugmad"><button class="btn sec" id="ponovo">Pročitaj ponovo</button><button class="btn" id="dom">Mapa</button></div>`;
if(!ekran.novo)h+=`<button class="link" id="btn-helena">💬 Razgovaraj sa Helenom o ovoj lekciji</button>`;
$app.innerHTML=h;window.scrollTo(0,0);
document.getElementById('nazad').onclick=()=>idi({tip:'oblast',oblast:l.oblast.id});
document.getElementById('ponovo').onclick=()=>idi({tip:'lekcija',id:l.id,korak:1});
document.getElementById('dom').onclick=()=>idi({tip:'pocetna'});
document.getElementById('btn-helena').onclick=()=>kaHeleni(l);
}

// Ponavljanje: promašena kartica se vraća na kraj reda dok je ne znaš (bar jednom).
// Ocena se upisuje po prvom pokušaju: znao → sledeća kutija, nisam → kutija 0 (sutra).
function ponavljanje(){
const e=ekran;
if(!e.red.length){
$app.innerHTML=`<div class="top"><h1>🦉 Ponavljanje</h1></div><div class="card istaknuto"><div class="nas">Gotovo za danas ✓</div><div class="sub">Sledeće kartice stižu same, kad dođe njihov dan.</div><button class="btn" id="dom">Mapa</button></div>`;
document.getElementById('dom').onclick=()=>idi({tip:'pocetna'});return;
}
const id=e.red[0],kk=kartica(id);
if(!kk){e.red.shift();return ponavljanje()}
const ukupno=Object.keys(e.prvi).length+e.red.filter(x=>!(x in e.prvi)).length;
let h=`<button class="nazad" id="nazad">← Mapa</button><div class="lbl" style="margin-top:.6rem">Ponavljanje · ${Object.keys(e.prvi).length}/${ukupno} · ${kk.l.oblast.ikona} ${esc(kk.l.naslov)}</div>
<div class="card kartica"><div>${esc(kk.p)}</div>${e.okrenuto?`<div class="o">${esc(kk.o)}</div>`:''}</div>`;
h+=e.okrenuto?`<div class="dugmad"><button class="btn sec" id="ne">Nisam znao</button><button class="btn" id="da">Znao sam</button></div>`
:`<p class="sub">Prvo odgovori u glavi (ili naglas), pa okreni.</p><button class="btn" id="okreni">Pokaži odgovor</button>`;
$app.innerHTML=h;
document.getElementById('nazad').onclick=()=>idi({tip:'pocetna'});
if(!e.okrenuto){document.getElementById('okreni').onclick=()=>{e.okrenuto=true;crtaj()};return}
const oceni=async znao=>{
const k=(S.kartice||{})[id]||{kutija:0};
if(!(id in e.prvi)){
e.prvi[id]=znao;
const kut=znao?Math.min((k.kutija||0)+1,RAZMACI.length-1):0;
await baza.pisi(`kartice/${id}`,{kutija:kut,sledece:danas(RAZMACI[kut]),poslednje:danas(),znao});
}
e.red.shift();if(!znao)e.red.push(id);
e.okrenuto=false;crtaj();
};
document.getElementById('da').onclick=()=>oceni(true);
document.getElementById('ne').onclick=()=>oceni(false);
}

function metod(){
$app.innerHTML=`<button class="nazad" id="nazad">← Mapa</button><div class="top" style="margin-top:.6rem"><h1>Kako ova škola uči</h1></div>
<div class="card metod">
<p><b>Cilj:</b> kostur svega bitnog — jedna priča od nastanka svemira do danas, plus alati za mišljenje. Ne detalji; dublje samo gde ti poželiš.</p>
<p><b>Pogodi pre čitanja.</b> Pokušaj odgovora, i pogrešan, pripremi mozak da upamti tačan.</p>
<p><b>Kratki delovi, provera odmah.</b> Posle svakog dela jedno pitanje i objašnjenje zašto.</p>
<p><b>Prisećanje bez gledanja.</b> Najjači poznati način učenja: izvlačenje iz glave, a ne ponovno čitanje.</p>
<p><b>Razgovor sa Helenom.</b> Ona proverava da li si stvarno razumeo, pita „zašto" i povezuje sa tvojim životom.</p>
<p><b>Ponavljanje sa razmakom.</b> Kartice se vraćaju posle 1, 3, 7, 21 i 60 dana. Bez toga se većina zaboravi za nedelju dana.</p>
</div>`;
document.getElementById('nazad').onclick=()=>idi({tip:'pocetna'});
}

function poruka(m,err){const p=document.getElementById('por');if(p){p.textContent=m;p.className='poruka'+(err?' err':'');setTimeout(()=>{p.textContent=''},2500)}}
function idi(e){ekran=e;crtaj()}

// ---------- start ----------
try{
baza=await napraviBazu();
S=await baza.citaj();
document.getElementById('gate').classList.add('skriven');
crtaj();
// živo osvežavanje (npr. Helenin komentar) — samo na mapi i pregledu, da ne prekida kucanje
baza.slusaj(d=>{S=d;if(crtano&&(ekran.tip==='pocetna'||ekran.tip==='pregled'||ekran.tip==='oblast'))crtaj()});
}catch(e){
document.getElementById('gate-sub').textContent='Ne mogu da učitam.';
greska(e.message||e);
}
if('serviceWorker' in navigator&&!PROBA){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
